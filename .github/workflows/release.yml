name: Release

# Builds a release from a tag on a clean GitHub-hosted runner. Release files must not be built on
# a developer Mac. Archive metadata checks do not replace a real first-launch test.
# Signing the build
# provenance with Sigstore (SLSA Build L2) and publishing checksums lets anyone verify a download
# came from this exact source, with no Apple account involved.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build a release for, e.g. v1.0'
        required: true

permissions:
  contents: write       # create the release + upload assets
  id-token: write       # Sigstore OIDC, required by attest-build-provenance
  attestations: write   # write the build-provenance attestation to this repo

jobs:
  release:
    name: Build, attest, and publish
    # Xcode 26 with the macOS 26 SDK, which the Control Center control needs.
    runs-on: macos-26
    steps:
      - name: Resolve tag and version
        id: ver
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          echo "SDK: $(xcrun --sdk macosx --show-sdk-version)"

      - name: Daemon script tests
        run: bash Tests/ExitIPDaemonTests/run.sh

      - name: Shared and installation tests
        run: |
          xcrun swift test
          bash Tests/ExitIPInstallTests/run.sh

      - name: Build the zip, package, install.sh, and SHA256SUMS
        env:
          EXIT_IP_RELEASE_REPO: ${{ github.repository }}
        # GitHub sets CI=true, so the script fails if any file carries extended attributes.
        run: bash Scripts/package-release.sh

      - name: Check the app version matches the tag
        run: |
          set -euo pipefail
          ZIP="dist/ExitIPMonitor-${{ steps.ver.outputs.version }}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::No $ZIP: the app's version doesn't match tag ${{ steps.ver.outputs.tag }}"
            ls -la dist
            exit 1
          fi
          cat dist/SHA256SUMS

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/ExitIPMonitor-*'

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > NOTES.md
          if ! grep -q '[^[:space:]]' NOTES.md; then
            echo "::error::CHANGELOG.md has no section for [$VER]"
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo "### Verify this download"
            echo '```sh'
            echo "shasum -a 256 -c SHA256SUMS"
            echo "gh attestation verify ExitIPMonitor-$VER.zip -R ${{ github.repository }}"
            echo '```'
          } >> NOTES.md
          echo "----- NOTES.md -----"; cat NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${{ steps.ver.outputs.version }}"
          TITLE="Exit IP Monitor $VER"
          FILES=(dist/ExitIPMonitor-"$VER".zip dist/ExitIPMonitor-"$VER".pkg dist/install.sh dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes-file NOTES.md --title "$TITLE"
          else
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes-file NOTES.md
          fi

      - name: Cask values
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          SHA="$(shasum -a 256 "dist/ExitIPMonitor-$VER.zip" | awk '{print $1}')"
          {
            echo "### Homebrew cask"
            echo "Set these in \`Casks/exit-ip-monitor.rb\` of jxz345/homebrew-tap:"
            echo '```ruby'
            echo "version \"$VER\""
            echo "sha256 \"$SHA\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
